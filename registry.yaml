  automation/evolutionary_learning/neural_memory_evaluation/smoke_test/partial_observability/cmaes:
    label: "Smoke test - partial_observability wrapper"
    purpose: >-
      One-off pipeline validation for envs/wrappers/partial_observability.py (new in this
