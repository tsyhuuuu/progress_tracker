  automation/evolutionary_learning/neural_memory_evaluation/cmaes:
    label: "Level 1 - full observation"
    purpose: "First of the 3 stages: see the basic B x C trend under full observation (the control condition)."
    status: paused
    started: 2026-09-03
    note: "20 conditions. Commented out in train_auto.bash while Level 2 runs - resume by uncommenting."
    planned_repeats: 10

  automation/evolutionary_learning/neural_memory_evaluation/velocity_masked/cmaes:
    label: "Level 2 - velocity masked"
    purpose: "Always mask velocity observations to make it a POMDP. Minimal check of whether memory is actually required for the task."
    status: active
    started: 2026-09-03
    note: "20 conditions. The only currently-uncommented line in train_auto.bash's configs[]."
    planned_repeats: 10

  automation/evolutionary_learning/neural_memory_evaluation/memory_horizon_sweep/cmaes:
    label: "Level 3 - memory horizon sweep"
    purpose: >-
      Velocity masking + a sweep of the position update interval over {2,4,8} steps. The
      main event: draws the boundary between what body tau can cover and where neural memory
      becomes necessary.
    status: paused
    started: null
    note: "60 conditions, the most computationally expensive stage, no runs started yet on this machine. Commented out in train_auto.bash - recommended order is to confirm the Level 1/2 trend first (see README) before scaling up here."
