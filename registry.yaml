# progress_tracker/registry.yaml
#
# "Why am I running this?" catalog, in two tiers matching how the dashboard groups things:
#
#   experiments: one entry per EXPERIMENT folder (automation/<group>/<name> - the directory that
#                groups a family of training-method subfolders, e.g. neural_size_evaluation,
#                neural_and_embodied_comparison, neural_memory_evaluation). <group> is currently
#                one of nested_learning or evolutionary_learning. A third top-level group,
#                automation/test_experiments1/, also exists on disk but is intentionally NOT
#                registered here - it's a from-scratch template/scratch area (mirrors the old
#                automation/nested_learning/test/ template dir this file used to exclude by that
#                name), not a tracked series. This is the level the dashboard's top-level cards
#                are keyed on, and where its headline "how far along is this experiment overall"
#                rollup is computed from.
#
#   methods:     one entry per training-method dir (the same shape as train_auto.bash's own
#                configs[] entries - a directory with a conditions/ subfolder, e.g.
#                neural_size_evaluation/td3, neural_memory_evaluation/velocity_masked/cmaes).
#                This is the level scan_status.py actually scans results/ under, and what the
#                dashboard shows once you open an experiment card's method breakdown.
#
# A method's experiment is derived automatically (build_dashboard.py: the first 3 "/"-separated
# path segments, e.g. "automation/evolutionary_learning/neural_memory_evaluation/velocity_masked/
# cmaes" groups under "automation/evolutionary_learning/neural_memory_evaluation") - no separate
# grouping field needed, just keep every method's key nested under its matching experiments: entry.
#
# Both are hand-maintained, not generated - add an experiments: entry when you create a new
# automation/<group>/<name> folder, and a methods: entry whenever you add a line to
# train_auto.bash's configs[] (active or commented-out/paused alike - paused series are still
# worth remembering "why"). Also includes neural_memory_evaluation's two smoke_test/ methods,
# which aren't in configs[] (they're one-off pipeline-validation runs, invoked directly per the
# series' own README rather than through train_auto.bash) but are still real conditions/ dirs
# worth a "why" entry.
#
# experiments: fields - label, plan_ref, purpose (see methods: below for the same fields'
# meaning - identical shape, just one level up).
# methods: fields - label (short - the experiment's own label already gives the context),
# purpose, status (active | paused | done | abandoned - your own bookkeeping, not derived from
# runs), started (YYYY-MM-DD or null), note, planned_repeats (int or null).
#
# planned_repeats: the target number of repeat runs (distinct seeds) you intend EACH condition
# in this method to eventually reach in total, combined across all 3 machines - NOT the same
# number as a single train_auto.bash invocation's REPEATS (that's a per-run batch size on one
# machine; round-robin repeats across many invocations/machines accumulate well past it, which
# is exactly why results/ can hold many times more run folders than conditions/ has yaml files).
# This is the one hand-maintained "how many, total" target; the actual observed count is
# read-only data scan_status.py already derives per machine (each condition's run_count in
# status/<machine>.json) and build_dashboard.py sums across machines (deduped by seed) to show
# against this target. Leave null until you've decided a target for that method's series.

experiments:
  automation/nested_learning/neural_size_evaluation:
    label: "Neural Size Evaluation"
    plan_ref: "documents/plan.md Sec.12.1 factor D (neural capacity grid) - reused by Sec.12.3 (E2)"
    purpose: >-
      train_auto.bash's own "Experiment 1-1": sweep neural-controller hidden-layer capacity
      (`hidden_dims`) across fore/hind biped and quadruped, under plain TD3. Not its own
      plan.md section - existing as a reusable capacity grid that Sec.12.1's factor D and E2
      (Sec.12.3, "does body memory let a SMALLER neural controller reach the same performance")
      both cite and reuse directly.

  automation/nested_learning/neural_activation_evaluation:
    label: "Neural Activation Evaluation"
    plan_ref: "not directly cited in documents/plan.md - exploratory/preliminary"
    purpose: >-
      train_auto.bash's own "Experiment 1-3": whether the choice of activation function
      differing between the muscle network and the neural controller matters for performance,
      under plain TD3.

  automation/nested_learning/muscle_activation_evaluation:
    label: "Muscle Activation Evaluation"
    plan_ref: "not directly cited in documents/plan.md - exploratory/preliminary"
    purpose: >-
      train_auto.bash's own "Experiment 1-4": whether the muscle network's own activation
      function choice matters for performance, under plain TD3.

  automation/nested_learning/neural_and_embodied_comparison:
    label: "Neural and Embodied Comparison"
    plan_ref: "documents/plan.md Sec.12.2 Experiment 1 (E1): body vs. neural computational allocation"
    purpose: >-
      E1's existing asset, cited by name in Sec.12.2: `ep_type` comparison (`neural` vs
      `neural-muscle`, cmaes/td3) across fore/hind biped and quadruped. plan.md's next step for
      E1 is adding `neural-skin`/`neural-muscle-skin` conditions here to round A (compute
      allocation) out to 4 levels, then drawing the parameter-count-vs-performance trade-off
      curve `ep_type` traces out per morphology.

  automation/evolutionary_learning/neural_memory_evaluation:
    label: "Neural Memory Evaluation"
    plan_ref: "documents/plan.md Sec.12.4 Experiment 3 (E3) [core of the first paper]"
    purpose: >-
      E3: whether body memory (muscle tau) and neural memory (mlp/gru/mamba/ctrnn/ltc) are
      substitutes or complements, tested via a full B x C factorial design x 3-level
      observability conditions (Level 1-3), plus 2 one-off smoke-test method dirs that gate
      production runs. No direct prior work exists for this question - the most novel
      experiment series in this project. Trains exclusively via CMA-ES (codesign.mode
      "cmaes_joint"), not TD3/PPO gradient updates - see the series' own README.md's "学習方法"
      section for why gradient training cannot correctly optimize a stateful actor in this repo.

methods:
