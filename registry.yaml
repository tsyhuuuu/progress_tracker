    label: "TD3"
    purpose: "Plain TD3 capacity sweep - see the experiment-level purpose above."
    status: paused
    started: 2026-09-02
    note: "9 conditions (fore/hind biped x 3 sizes, quadruped x 3 sizes). Commented out in train_auto.bash - resume by uncommenting."
    planned_repeats: 10

  automation/nested_learning/neural_activation_evaluation/td3:
    label: "TD3"
    purpose: "Plain TD3 activation-function comparison - see the experiment-level purpose above."
    status: paused
